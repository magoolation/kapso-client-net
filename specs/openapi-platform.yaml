      operationId: getWhatsappFlowDataEndpoint
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFlowDataEndpointResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          description: No data endpoint configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - WhatsApp Flows
      summary: Create/update data endpoint
      description: Create or update the data endpoint function code. The function
        handles dynamic data for your flow.
      operationId: createWhatsappFlowDataEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappFlowDataEndpointCreateRequest"
      responses:
        "200":
          description: Data endpoint saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFlowDataEndpointResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

    patch:
      tags:
        - WhatsApp Flows
      summary: Attach an existing data endpoint function
      description: |
        Attach a deployed function from the same project and register the flow's
        Kapso data endpoint with Meta. Multiple flows can share one function.
        Requires a WhatsApp phone number and flows encryption to be configured.
        Does not create or deploy a function. Replaces any previous association
        without deleting the previous function or rotating the endpoint secret.
        Updating or deploying a shared function affects every flow using it.
        Published flows are automatically republished; a republish failure returns
        HTTP 200 with data.warning and leaves the new association in place.
      operationId: updateWhatsappFlowDataEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappFlowDataEndpointAttachRequest"
      responses:
        "200":
          description: Function attached and endpoint registered. Check data.warning for republish failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFlowDataEndpointAttachResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Flow or function not found in this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Function is not deployed, phone number or encryption is missing, or Meta rejected the endpoint update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

