              type: string
            wa_id:
              type: string
            profile_name:
              type: string
            display_name:
              type: string
        whatsapp_conversation:
          type: object
          nullable: true
          description: Associated conversation (basic view)
          properties:
            id:
              type: string
            phone_number:
              type: string
            status:
              type: string
            last_active_at:
              type: string
              format: date-time
    FlowSummary:
