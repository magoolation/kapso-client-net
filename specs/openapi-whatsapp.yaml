    post:
      tags:
        - Messages
      summary: Send a message
      description: |
        Send a WhatsApp message to a recipient.

        Use `to` for phone numbers. Use `recipient` for a BSUID or parent BSUID.
        If both are present, the phone number in `to` takes precedence.

        Supports all WhatsApp message types:
        - **text**: Plain text messages with optional URL preview
        - **image**: Images with optional caption
        - **video**: Videos with optional caption
        - **audio**: Audio files
        - **document**: Documents with optional caption and filename
        - **sticker**: Stickers
        - **location**: Location sharing
        - **contacts**: Contact cards
        - **interactive**: Interactive messages (buttons, lists, flows)
        - **template**: Message templates
        - **reaction**: Emoji reactions to messages

        On a [shared number](/docs/whatsapp/conversation-routing), regular messages need Kapso to handle
        the conversation. Templates can always be sent.
      operationId: sendMessage
      parameters:
        - name: X-Kapso-Take-Control
          in: header
          required: false
          description: |
            Shared numbers only. Set to `true` to send even though another app handles the
            conversation. Meta accepts it only when Kapso is your escalation app, and the send
            takes the conversation.
          schema:
            type: string
            enum:
              - "true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/WhatsappMessage"
                - $ref: "#/components/schemas/MarkReadRequest"
            examples:
              text_message:
                summary: Send text message
                value:
                  messaging_product: whatsapp
                  recipient_type: individual
                  to: "15551234567"
                  type: text
                  text:
                    body: "Hello! Your order #12345 has been shipped."
              text_message_to_bsuid:
                summary: Send text message to BSUID
                description: Non-template messages require an open 24-hour customer service window.
                value:
                  messaging_product: whatsapp
                  recipient_type: individual
                  recipient: US.13491208655302741918
                  type: text
                  text:
                    body: "Hello! Your order #12345 has been shipped."
              template_to_bsuid:
                summary: Send template to BSUID
                value:
                  messaging_product: whatsapp
                  recipient_type: individual
                  recipient: US.13491208655302741918
                  type: template
                  template:
                    name: order_update
                    language:
                      code: en_US
              image_message:
                summary: Send image with caption
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: image
                  image:
                    link: https://example.com/product.jpg
                    caption: Check out our new product!
              voice_message:
                summary: Send voice message (voice note)
                description: |-
                  Voice messages must be .ogg files encoded with OPUS codec.
                  Includes automatic download, profile picture, voice icon, and optional transcription.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: audio
                  audio:
                    id: "1013859600285441"
                    voice: true
              basic_audio_message:
                summary: Send basic audio message
                description: |-
                  Basic audio messages display a download icon and music icon.
                  Supports AAC, AMR, MP3, MP4, and OGG formats (max 16MB).
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: audio
                  audio:
                    link: https://example.com/ringtone.mp3
              template_named_params:
                summary: Template with named parameters
                description: |
                  Named parameters allow flexible ordering and clearer intent.
                  Use `parameter_name` field to specify which variable to fill.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: order_confirmation
                    language:
                      code: en_US
                    components:
                      - type: body
                        parameters:
                          - type: text
                            parameter_name: first_name
                            text: Jessica
                          - type: text
                            parameter_name: order_number
                            text: SKBUP2-4CPIG9
              template_positional_params:
                summary: Template with positional parameters
                description: |
                  Positional parameters must appear in order ({{1}}, {{2}}, etc.).
                  Order matters - first param fills {{1}}, second fills {{2}}.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: order_confirmation
                    language:
                      code: en_US
                    components:
                      - type: body
                        parameters:
                          - type: text
                            text: Jessica
                          - type: text
                            text: SKBUP2-4CPIG9
              template_with_media_header:
                summary: Template with image header and named params
                description: |
                  Headers can include media (image/video/document).
                  Use media ID from upload endpoint or public URL.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: seasonal_promotion
                    language:
                      code: en_US
                    components:
                      - type: header
                        parameters:
                          - type: image
                            image:
                              link: https://example.com/summer-sale.jpg
                      - type: body
                        parameters:
                          - type: text
                            parameter_name: sale_name
                            text: Summer Sale
                          - type: text
                            parameter_name: discount_code
                            text: SUMMER25
                          - type: text
                            parameter_name: discount_amount
                            text: 25%
              template_with_header_footer:
                summary: Template with text header and footer
                description: |
                  Text headers support 1 parameter (named or positional).
                  Footers are static text defined in template.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: seasonal_promotion
                    language:
                      code: en_US
                    components:
                      - type: header
                        parameters:
                          - type: text
                            parameter_name: sale_name
                            text: Black Friday Sale
                      - type: body
                        parameters:
                          - type: text
                            parameter_name: end_date
                            text: November 30th
                          - type: text
                            parameter_name: discount_code
                            text: BF2024
              template_with_url_button:
                summary: Template with URL button variable
                description: |
                  URL buttons can have 1 variable at the end.
                  Use button component with sub_type URL and index.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: limited_time_offer
                    language:
                      code: en_US
                    components:
                      - type: body
                        parameters:
                          - type: text
                            parameter_name: customer_name
                            text: Mark
                          - type: text
                            parameter_name: package_name
                            text: Premium Package
                      - type: button
                        sub_type: url
                        index: "0"
                        parameters:
                          - type: text
                            text: summer2024
              template_with_quick_reply:
                summary: Template with quick reply buttons
                description: |
                  Quick reply buttons use payload parameter.
                  Index determines button order (0-based).
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: customer_feedback
                    language:
                      code: en_US
                    components:
                      - type: body
                        parameters:
                          - type: text
                            parameter_name: customer_name
                            text: Sarah
                      - type: button
                        sub_type: quick_reply
                        index: "0"
                        parameters:
                          - type: payload
                            payload: yes_helpful
                      - type: button
                        sub_type: quick_reply
                        index: "1"
                        parameters:
                          - type: payload
                            payload: no_not_helpful
              template_with_flow:
                summary: Template with flow button
                description: |
                  Flow buttons trigger WhatsApp Flows.
                  Pass flow_token and flow_action_data as parameters.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: template
                  template:
                    name: appointment_booking
                    language:
                      code: en_US
                    components:
                      - type: body
                        parameters:
                          - type: text
                            parameter_name: customer_name
                            text: Michael
                      - type: button
                        sub_type: flow
                        index: "0"
                        parameters:
                          - type: action
                            action:
                              flow_token: user_session_abc123
                              flow_action_data:
                                customer_id: cust_12345
                                preferred_date: 2024-02-15
              interactive_button:
                summary: Send interactive button message
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: interactive
                  interactive:
                    type: button
                    body:
                      text: Would you like to proceed with your order?
                    action:
                      buttons:
                        - type: reply
                          reply:
                            id: btn_yes
                            title: Yes
                        - type: reply
                          reply:
                            id: btn_no
                            title: No
              interactive_cta_url:
                summary: Interactive CTA URL button
                description: |-
                  Send a call-to-action button that opens a URL.
                  Useful for obscuring long tracking URLs.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: interactive
                  interactive:
                    type: cta_url
                    header:
                      type: text
                      text: New workshop dates announced!
                    body:
                      text: Tap the button below to see available dates.
                    footer:
                      text: Dates subject to change
                    action:
                      name: cta_url
                      parameters:
                        display_text: See Dates
                        url: https://example.com/workshops?utm_source=whatsapp
              interactive_order_details_pix:
                summary: Interactive order details with dynamic Pix
                description: |-
                  Send an order for the user to review and pay with Pix.
                  Requires a WhatsApp Business Account enabled for the Meta Brazil Payments API.
                value:
                  messaging_product: whatsapp
                  to: "5511999999999"
                  type: interactive
                  interactive:
                    type: order_details
                    body:
                      text: Order details
                    action:
                      name: review_and_pay
                      parameters:
                        reference_id: pix-order-123
                        type: digital-goods
                        payment_type: br
                        payment_settings:
                          - type: pix_dynamic_code
                            pix_dynamic_code:
                              code: 00020101021226820014br.gov.bcb.pix
                              merchant_name: Kapso Merchant
                              key: "12345678000199"
                              key_type: CNPJ
                        currency: BRL
                        total_amount:
                          value: 1000
                          offset: 100
                        order:
                          status: pending
                          tax:
                            value: 0
                            offset: 100
                          items:
                            - retailer_id: item-1
                              name: Subscription
                              amount:
                                value: 1000
                                offset: 100
                              quantity: 1
                          subtotal:
                            value: 1000
                            offset: 100
              interactive_order_status:
                summary: Interactive order status update
                description: |-
                  Update a previously sent order using the same reference_id.
                value:
                  messaging_product: whatsapp
                  to: "5511999999999"
                  type: interactive
                  interactive:
                    type: order_status
                    body:
                      text: Payment confirmed
                    action:
                      name: review_order
                      parameters:
                        reference_id: pix-order-123
                        order:
                          status: processing
                        payment:
                          status: captured
              interactive_carousel_url:
                summary: Interactive carousel with URL buttons
                description: |-
                  Send a free-form media carousel with 2-10 cards. Each card includes
                  an image or video header and a CTA URL button.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: interactive
                  interactive:
                    type: carousel
                    body:
                      text: Choose a trip option
                    action:
                      cards:
                        - card_index: 0
                          type: cta_url
                          header:
                            type: image
                            image:
                              link: https://example.com/flight-a.jpg
                          body:
                            text: Morning flight
                          action:
                            name: cta_url
                            parameters:
                              display_text: View
                              url: https://example.com/flights/a
                        - card_index: 1
                          type: cta_url
                          header:
                            type: image
                            image:
                              link: https://example.com/flight-b.jpg
                          body:
                            text: Evening flight
                          action:
                            name: cta_url
                            parameters:
                              display_text: View
                              url: https://example.com/flights/b
              interactive_carousel_quick_reply:
                summary: Interactive carousel with quick replies
                description: |-
                  Send a free-form media carousel where every card has the same
                  quick-reply button structure.
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  type: interactive
                  interactive:
                    type: carousel
                    body:
                      text: Pick a product
                    action:
                      cards:
                        - card_index: 0
                          type: cta_url
                          header:
                            type: image
                            image:
                              link: https://example.com/product-a.jpg
                          action:
                            buttons:
                              - type: quick_reply
                                quick_reply:
                                  id: product_a_yes
                                  title: Select
                        - card_index: 1
                          type: cta_url
                          header:
                            type: image
                            image:
                              link: https://example.com/product-b.jpg
                          action:
                            buttons:
                              - type: quick_reply
                                quick_reply:
                                  id: product_b_yes
                                  title: Select
              interactive_list:
                summary: Interactive list message
