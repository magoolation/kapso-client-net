name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Required for trusted publishing. Without it NuGet/login fails with 403.
      # The job trades this short-lived OIDC token for a temporary API key, so
      # there is no long-lived secret to rotate or leak.
      id-token: write
    steps:
      # MinVer versions an untagged commit as 0.0.0-alpha.N. Publishing that would
      # burn the version on nuget.org for good, since a published version can be
      # unlisted but never removed. workflow_dispatch stays available for
      # re-running a release, but only ever against a tag.
      - name: Refuse to publish an untagged build
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::A release must run from a v* tag, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # MinVer reads the tag to derive the package version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      - run: dotnet test --project tests/Kapso.Tests -c Release --no-build

      - run: dotnet pack src/Kapso -c Release --no-build -o artifacts

      - name: Show what will be published
        run: ls -lh artifacts

      # Requires a trusted publishing policy on nuget.org for this repository.
      # See: https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: Exchange the OIDC token for a temporary NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile name, not the email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/*
