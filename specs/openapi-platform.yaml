  /findings:
    get:
      tags:
        - Findings
      summary: List findings
      description: |
        Returns the findings for the project associated with your API key, most recently
        qualified first.

        Only findings with status `candidate` or `open` are listed. Quiet findings,
        dismissed findings, and findings from sources Kapso does not read evidence from
        yet are omitted. To read a quiet or dismissed finding, fetch it by ID.

        Findings that belong to the same group are returned together on the same page,
        so a page can hold slightly more than `limit` items.
      operationId: listFindings
      parameters:
        - name: limit
          in: query
          description: |
            Findings per page. Must be between 1 and 25. Any other value returns `400`;
            it is not clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 20
        - name: after
          in: query
          description: |
            Opaque cursor from a previous response's `paging.next`. Cannot be combined
            with `before`.
          schema:
            type: string
        - name: before
          in: query
          description: |
            Opaque cursor from a previous response's `paging.previous`. Cannot be combined
            with `after`.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              example:
                data:
                  - id: "8f14e45f-ceea-467a-9e1a-1b2c3d4e5f60"
                    signal_name: conversation.user_frustrated
                    direction: rising
                    status: open
                    affected_count: 42
