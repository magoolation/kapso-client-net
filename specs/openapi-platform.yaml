    WhatsappFunding:
      type: object
      required:
        - waba_id
        - business_portfolio_id
        - status
        - reason
        - message
        - currency
        - waba_currency
        - last_verified_at
        - last_checked_at
        - paid_messages
        - operation
      properties:
        waba_id:
          type: string
          description: Meta WhatsApp Business Account ID.
          example: "4188880514714289"
        business_portfolio_id:
          type: string
          nullable: true
          description: Meta Business Portfolio ID that owns the WABA.
          example: "1991231921410797"
        status:
          type: string
          description: |
            Funding state derived from locally persisted evidence.

            - `funded`: funding is verified, the allocation is approved and observed funding IDs match.
            - `pending`: an initial funding operation is in progress.
            - `unknown`: previously verified, but current evidence cannot confirm funding.
            - `not_funded`: funding was never verified, including an attempt retired because the customer kept their existing Meta payment method.
            - `revoked`: Meta allocation evidence confirms the funding was deleted.
          enum:
            - funded
            - pending
            - unknown
            - not_funded
            - revoked
        reason:
          type: string
          nullable: true
          description: Machine-readable reason, `null` when `status` is `funded`. Treat as
            an extensible string; new values can be added.
          example: existing_payment_method
        message:
          type: string
          description: Display copy for `reason`. Do not parse.
          example: Existing Meta payment method kept.
        currency:
          type: string
          description: Kapso settlement currency.
          example: USD
        waba_currency:
          type: string
          nullable: true
          description: Funding snapshot currency, or the observed WABA currency when no
            funding attachment exists.
          example: USD
        last_verified_at:
          type: string
          format: date-time
          nullable: true
          description: Latest recorded transition into verified funding.
        last_checked_at:
          type: string
          format: date-time
          nullable: true
          description: Last funding check, including failed attempts.
        paid_messages:
          type: object
          description: Local billing pauses on this project's funding attachment. Not an
            authorization promise - balance, credentials and Meta restrictions can still
            block sending.
          required:
            - paused
            - reasons
          properties:
            paused:
              type: boolean
            reasons:
              type: array
              items:
                type: string
        operation:
          $ref: "#/components/schemas/WhatsappFundingRun"

    WhatsappFundingRun:
      type: object
      nullable: true
      description: Latest funding run for this WABA in your project, or `null` when no run
        was ever started. A terminal run does not promise funding - read `status` on the
        funding object as well.
      required:
        - id
        - status
        - started_at
        - finished_at
        - error_kind
        - meta_error_code
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - cancelled
            - expired
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        error_kind:
          type: string
          nullable: true
          description: Machine-readable failure class of the run. Treat as an extensible
            string. No provider messages or credentials are included.
        meta_error_code:
          type: integer
          nullable: true
          description: Meta error code recorded for the failed run, when one was returned.

    WhatsappEnsureFundingRequest:
      type: object
      required:
        - business_portfolio_id
      properties:
        business_portfolio_id:
          type: string
          description: Meta Business Portfolio ID that owns the WABA. Digits only.
          example: "823380597459265"

    WhatsappFundingResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/WhatsappFunding"

    WhatsappFundingListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappFunding"
        paging:
          $ref: "#/components/schemas/Paging"

    WhatsappBillingUsage:
      type: object
      required:
        - start_time
        - end_time
        - time_basis
        - currency
        - charge_scope
        - totals
        - breakdown
      properties:
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        time_basis:
          type: string
          description: The window measures when charges were recorded, not when Meta
            delivered the original messages.
          const: recorded_at
        currency:
          type: string
          example: USD
        charge_scope:
          type: string
          description: Charges recorded by Kapso, not Meta's complete invoice or
            native-currency costs.
          const: kapso_recorded_charges
        totals:
          type: object
          required:
            - customer_charge_micro_usd
          properties:
            customer_charge_micro_usd:
              type: integer
              description: Sum of every `breakdown` charge, in micro-USD (`1000000` is
                USD 1). Signed corrections are included, so a correction-only window can
                be negative.
              example: 115000
        breakdown:
          type: array
          description: One entry per recorded usage kind, each with its own freshness.
            New kinds can be added; do not rely on array order, and handle unknown
            `usage_kind` values. Use `totals` for the overall recorded amount.
          items:
            $ref: "#/components/schemas/WhatsappBillingUsageBreakdownItem"

    WhatsappBillingUsageBreakdownItem:
      type: object
      required:
        - usage_kind
        - customer_charge_micro_usd
        - sync
      properties:
        usage_kind:
          type: string
          description: Extensible machine-readable kind of recorded charge.
          example: messaging
        customer_charge_micro_usd:
          type: integer
          description: Recorded charge for this kind, in micro-USD.
          example: 90000
        billable_messages:
          type: integer
          description: Messaging only. Calling reports aggregate fees, not call counts
            or minutes.
          example: 1
        coverage:
          type: object
          description: Calling only. Current active-attachment currency support. Support
            does not promise billing activation, working credentials or complete
            observations, and historical charges stay in the total after support is lost.
          required:
            - status
            - reason
          properties:
            status:
              type: string
              description: |
                - `supported`: every active attachment is a USD WABA.
                - `partial`: mixed USD and non-USD attachments. Fresh USD observations do
                  not establish zero calling cost for the non-USD WABAs.
                - `unsupported`: no USD attachment.
                - `not_available`: no active attachment.
              enum:
                - supported
                - partial
                - unsupported
                - not_available
            reason:
              type: string
              nullable: true
              description: '`calling_requires_usd_waba` for `partial`/`unsupported`,
                `no_active_attachment` for `not_available`, null for `supported`.'
              example: calling_requires_usd_waba
        sync:
          $ref: "#/components/schemas/WhatsappBillingUsageSync"

    WhatsappBillingUsageSync:
      type: object
      description: Current observation health for this usage kind, not completeness of
        the requested range.
      required:
        - status
        - last_synced_at
        - usage_through
      properties:
        status:
          type: string
          description: |
            - `synced`: every relevant account is fresh. Messaging settles within 15
              minutes; calling coverage is under one hour old.
            - `delayed`: evidence exists but at least one account is older than that
              boundary. The boundary labels freshness, not a calling authorization
              cutoff or a promise that every cold account is polled on that cadence.
            - `unknown`: at least one relevant account has no successful observation.
            - `not_available`: no coverage applies, for example a direct managed-billing
              account for messaging, or no active USD attachment for calling. Totals are
              still returned.
          enum:
            - synced
            - delayed
            - unknown
            - not_available
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: Messaging - oldest latest successful settlement across the
            relevant accounts. Always null for calling, which stores a coverage
            watermark instead of a settlement completion timestamp.
        usage_through:
          type: string
          format: date-time
          nullable: true
          description: Conservative common end of processed coverage. For messaging, the
            common end of the processed query windows capped at fetch completion; for
            calling, the oldest reconciled coverage watermark across USD attachments. Not
            a guarantee that Meta has reported everything for that period.

    WhatsappBillingUsageResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/WhatsappBillingUsage"

    WhatsappFundingOperation:
      type: object
      required:
        - operation_id
        - business_portfolio_id
        - status
        - requested_at
        - message
      properties:
        operation_id:
          type: string
          format: uuid
        business_portfolio_id:
          type: string
          example: "30458864570425307"
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - superseded
        requested_at:
          type: string
          format: date-time
        message:
          type: string
          example: Portfolio funding revocation is queued.

    WhatsappFundingOperationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/WhatsappFundingOperation"

  responses:
    UnauthorizedError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PaymentRequiredError:
      description: Feature requires a paid plan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

paths:
