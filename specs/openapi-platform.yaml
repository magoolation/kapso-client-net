                            label: All sources
                            color: transparent
                            aliases:
                              - all
                          - value: external_api_log
                            label: API
                            color: "#2563eb"
                            aliases:
                              - api
                              - external_api_log
                        filter_suggestions:
                          - key: endpoint
                            label: "endpoint:"
                            description: API endpoint contains text
                            param_key: endpoint_contains
                            sources:
                              - external_api_log
                        detail_fields:
                          - flow_execution_id
                          - event_type
                          - endpoint
                          - response_status
                unavailable:
                  summary: Log search unavailable
                  value:
                    data:
                      available: false
                      events: []
        "401":
          $ref: "#/components/responses/UnauthorizedError"

