          type:
            - string
            - "null"
          format: date-time
          description: When sending started
        stopped_at:
          type:
            - string
            - "null"
          format: date-time
          description: When sending was stopped
        completed_at:
          type:
            - string
            - "null"
          format: date-time
          description: When completed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sent_count:
          type: integer
          minimum: 0
          description: Messages sent
        failed_count:
          type: integer
          minimum: 0
          description: Failures
        delivered_count:
          type: integer
          minimum: 0
          description: Delivered
        read_count:
          type: integer
          minimum: 0
          description: Read
        pending_count:
          type: integer
          minimum: 0
          description: Pending
        suppressed_count:
          type: integer
          minimum: 0
