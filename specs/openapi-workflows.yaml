  /workflow_executions/{execution_id}/resume:
    parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Execution identifier
    post:
      tags:
        - Workflows
      summary: Resume waiting workflow execution
      description: |
        Resume a workflow execution that is in 'waiting' status. Workflows enter waiting status when they reach a wait_for_response step or are explicitly paused.

        Send a message with:
        - `kind`: Message type, defaults to "payload" if omitted
        - `data`: The actual payload - can be a string for simple text responses (e.g., "yes", "no") or an object for structured data (e.g., button clicks, form submissions)

        Optionally include variables to update the execution context:
        - `variables`: Key-value pairs to merge into the execution context. These will be available in subsequent workflow steps as `{{var_name}}`. Existing variables with the same key will be overwritten.

        After resuming, the workflow will continue processing from the waiting step with the provided message data and updated variables.

        **Call workflow routing**: If the execution is waiting at a call workflow step, the input is routed to the child execution it started, following the chain down to the deepest waiting execution. Keep sending resumes to the original execution ID; the response reports where the input landed in `id`, echoes the requested ID in `requested_execution_id`, and includes `parent_flow_execution_id`.

        **Response**: Returns minimal execution data (id, status, tracking_id, timestamps, workflow, current_step) plus the routing fields. Does not include execution_context or events. Use GET /workflow_executions/{id} to retrieve full execution details.
      operationId: resumeWorkflowExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowExecutionResumeRequest"
      responses:
        "200":
          description: Execution resumed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionResumeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: |
            Conflict — the execution could not be resumed right now. Either a resume request is already pending for this execution, or the execution is being processed by another request. Retry after a short delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            The target execution is not in `waiting` status, or the call workflow step was changed while its child execution was still active (`error: "Execution configuration changed"`). Restore the original called workflow before resuming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            The resume request was accepted but could not be queued for processing. No resume is in flight and any submitted variables were rolled back. Retry the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workflows/{workflow_id}/triggers:
