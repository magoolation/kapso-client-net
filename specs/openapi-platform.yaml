          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          description: Cursor for the next page. Pass `paging.next` unchanged.
          schema:
            type: string
        - name: before
          in: query
          description: Cursor for the previous page.
          schema:
            type: string
      responses:
        "200":
          description: Accounts with funding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFundingListResponse"
        "400":
          description: Invalid cursor or pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /whatsapp/portfolios/{portfolio_id}/usage:
    get:
      tags:
        - WhatsApp Funding
      summary: Get portfolio usage
      description: |
        Returns charges recorded for this project across the portfolio's accounts, broken down
        by usage kind. Other partners' activity on the same portfolio is not included.
      operationId: getWhatsappPortfolioUsage
      parameters:
        - name: portfolio_id
          in: path
          required: true
          description: Meta Business Portfolio ID.
          schema:
            type: string
        - name: start_time
          in: query
          required: true
          description: Inclusive start of the window, ISO 8601 with an offset or `Z`.
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: true
          description: Exclusive end of the window. At most 31 days after `start_time`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Recorded usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappBillingUsageResponse"
        "400":
          description: Invalid or missing time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /whatsapp/portfolios/{portfolio_id}/funding/revoke:
    post:
      tags:
        - WhatsApp Funding
      summary: Stop portfolio funding
      description: |
        Queues an asynchronous stop of Kapso funding for a Meta Business Portfolio. No request
        body is required.

        Disables portfolio auto-funding and revokes each approved allocation in the validated
        scope, so **every WABA using that allocation is affected**. A `202` is acceptance, not
        confirmation that Meta funding stopped - poll the operation endpoint until `succeeded`
        or `failed`.

        Revoking funding does not disconnect numbers, remove a partner, erase billing history,
        or forgive outstanding usage. Customers may need their own Meta payment method
        afterwards.
      operationId: revokeWhatsappPortfolioFunding
      parameters:
        - name: portfolio_id
          in: path
          required: true
          description: Meta Business Portfolio ID.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable unique key of 1-255 bytes per logical request. Reuse it when
            retrying after a network failure - the original operation is returned. Reusing a
            key for a different portfolio returns 409.
          schema:
            type: string
            minLength: 1
      responses:
        "202":
          description: Revocation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFundingOperationResponse"
              example:
                data:
                  operation_id: 2a2c446c-87c2-4f8a-ae74-aef1819e03f5
                  business_portfolio_id: "30458864570425307"
                  status: queued
                  requested_at: "2026-09-13T02:45:00Z"
                  message: Portfolio funding revocation is queued.
        "400":
          description: Missing or oversized Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: An Idempotency-Key header of 1 to 255 bytes is required.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          description: The Idempotency-Key was used for another portfolio, or the scope is unsafe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: This Idempotency-Key was used for another portfolio.
        "503":
          description: Revocation queue unavailable, retry with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /whatsapp/portfolios/{portfolio_id}/funding/operations/{operation_id}:
    get:
      tags:
        - WhatsApp Funding
      summary: Get funding operation
      description: |
        Returns the status of a revocation operation. Readable after the WABA moves or is
        disconnected. A `failed` operation can be partially completed - inspect WABA funding
        and contact support before starting a new one.
      operationId: getWhatsappPortfolioFundingOperation
      parameters:
        - name: portfolio_id
          in: path
          required: true
          description: Meta Business Portfolio ID.
          schema:
            type: string
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFundingOperationResponse"
              example:
                data:
                  operation_id: 2a2c446c-87c2-4f8a-ae74-aef1819e03f5
                  business_portfolio_id: "30458864570425307"
                  status: succeeded
                  requested_at: "2026-09-13T02:45:00Z"
                  message: Portfolio funding has been stopped.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
