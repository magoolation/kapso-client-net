  /findings/{finding_id}/start_investigation:
    post:
      tags:
        - Findings
      summary: Start an investigation
      description: |
        Queues a Kapso Agent Investigator run for the finding. The investigation is
        asynchronous; poll the finding to read the result.

        Returns `422` when the finding already has an active investigation, is not
        currently eligible for one, or the investigator is not configured for the project,
        and `409` when another dispatch is in flight.
      operationId: startFindingInvestigation
      parameters:
        - name: finding_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Investigation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingInvestigationAcceptedResponse"
              example:
                data:
                  finding_id: "8f14e45f-ceea-467a-9e1a-1b2c3d4e5f60"
                  investigation_id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
                  status: queued
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: |
            Finding not found (`finding_not_found`), or Findings is not enabled for this
            project (`findings_not_enabled`). Read `code` to tell them apart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
              example:
                error: Finding not found in this project.
                code: finding_not_found
        "409":
          description: An investigation dispatch is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
        "422":
          description: Finding is not eligible for investigation, or the investigator is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
              example:
                error: The Finding is already being investigated or is not currently eligible.
                code: investigation_unavailable

  /findings/{finding_id}/dismiss:
    post:
      tags:
        - Findings
      summary: Dismiss a finding
      description: |
        Removes the finding from the list. Both `reason` and `note` are required.
        A dismissed finding can reopen if monitoring detects the problem again, and it
        stays readable through `GET /findings/{finding_id}`.
      operationId: dismissFinding
      parameters:
        - name: finding_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
                - note
              properties:
                reason:
                  type: string
                  enum:
                    - not_relevant
                    - expected_behavior
                    - already_fixed
                    - incorrect
                    - other
                note:
                  type: string
                  description: Why the finding is being dismissed.
            example:
              reason: already_fixed
              note: The workflow was corrected in release 2.4.
      responses:
        "200":
          description: Finding dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingVerificationMutationResponse"
              example:
                data:
                  finding_id: "8f14e45f-ceea-467a-9e1a-1b2c3d4e5f60"
                  verification_id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
                  status: dismissed
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: |
            Finding not found (`finding_not_found`), or Findings is not enabled for this
            project (`findings_not_enabled`). Read `code` to tell them apart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
              example:
                error: Finding not found in this project.
                code: finding_not_found
        "422":
          description: Missing or invalid `reason` or `note`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
              example:
                error: "param is missing or the value is empty: note"

  /findings/{finding_id}/mark_addressed:
    post:
      tags:
        - Findings
      summary: Mark a finding as addressed
      description: |
        Records the current metrics as a baseline and starts monitoring the finding.
        Requires a completed investigation that covers the finding's current evidence;
        otherwise this returns `422`.
      operationId: markFindingAddressed
      parameters:
        - name: finding_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Monitoring started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingVerificationMutationResponse"
              example:
                data:
                  finding_id: "8f14e45f-ceea-467a-9e1a-1b2c3d4e5f60"
                  verification_id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
                  status: monitoring
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: |
            Finding not found (`finding_not_found`), or Findings is not enabled for this
            project (`findings_not_enabled`). Read `code` to tell them apart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
              example:
                error: Finding not found in this project.
                code: finding_not_found
        "422":
          description: Finding has no completed investigation covering its current evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsErrorResponse"
              example:
                error: Only completed investigations covering current evidence can be marked as addressed.

  /notifications/events:
    get:
      tags:
        - Notifications
      summary: List notification event types
      description: |
        The catalog of events you can route, ordered by category and name. Use `key` when
        creating a route. Internal events such as the test notification are not listed.
      operationId: listNotificationEventTypes
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationEventType"
              example:
                data:
                  - key: findings.detected
                    name: New finding detected
                    description: When Kapso detects a new finding, not each refresh of its evidence.
                    category: findings
                    severity: warning
                    supported_channels: [email, slack]
                    data_contract:
                      required: []
                      optional: [title, message, resource_name, details, occurred_at]
                    surface_path_template: "/projects/%<project_id>s/findings"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /notifications/destinations:
    get:
      tags:
        - Notifications
      summary: List team destinations
      description: |
        Returns the project's shared email destinations and the Slack channel destinations
        connected from the Kapso app, including `pending` and `unhealthy` ones. Removed
        destinations and personal member destinations are never returned.
      operationId: listNotificationDestinations
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationDestination"
              example:
                data:
                  - id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
                    kind: shared_email
                    label: Ops inbox
                    status: active
                    channel: email
                    address: ops@example.com
                    verified_at: "2026-09-01T12:00:00.000000Z"
                    slack_channel_binding_id: null
                    workspace_name: null
                    user_id: null
                    created_at: "2026-09-01T11:58:00.000000Z"
                    updated_at: "2026-09-01T12:00:00.000000Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags:
        - Notifications
      summary: Create a shared email destination
      description: |
        Creates a `shared_email` destination with status `pending` and sends a verification
        email to the address. The link expires after 7 days. The destination cannot receive
        notifications until the recipient confirms. Addresses belonging to project members
        are rejected; those members manage their own personal notification preferences in
        the Kapso app.

        Slack channels are added from the Kapso app under **Notifications**. Once connected
        they appear in `GET /notifications/destinations` and can be routed like any other
        destination. Requesting `kind: slack_channel` here returns `400`.

        Creating a destination for an address that was previously removed reuses the
        existing destination: it returns to `pending` and a new verification email is sent.
      operationId: createNotificationDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - address
              properties:
                kind:
                  type: string
                  enum: [shared_email]
                address:
                  type: string
                  description: Email address.
                label:
                  type: string
                  description: Display name for the destination. Optional.
            example:
              kind: shared_email
              address: ops@example.com
              label: Ops inbox
      responses:
        "201":
          description: Destination created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationDestination"
              example:
                data:
                  id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
                  kind: shared_email
                  label: Ops inbox
                  status: pending
                  channel: email
                  address: ops@example.com
                  verified_at: null
                  slack_channel_binding_id: null
                  workspace_name: null
                  user_id: null
                  created_at: "2026-09-01T11:58:00.000000Z"
                  updated_at: "2026-09-01T11:58:00.000000Z"
        "400":
          description: Unsupported destination kind
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Add Slack channels through the dashboard.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          description: Invalid destination
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              examples:
                member_address:
                  value:
                    errors:
                      base:
                        - This email belongs to a project member. Use a shared inbox for team alerts.
                suppressed_address:
                  value:
                    errors:
                      base:
                        - This email address is blocked from receiving emails. Use a different shared inbox.

  /notifications/destinations/{destination_id}:
    delete:
      tags:
        - Notifications
      summary: Remove a team destination
      description: |
        Disables a shared email or Slack channel destination, deletes its routes, and
        cancels its pending deliveries. The destination stops appearing in
        `GET /notifications/destinations`; its delivery history is kept. Personal member
        destinations are not addressable and return `404`.
      operationId: deleteNotificationDestination
      parameters:
        - name: destination_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Destination removed
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Destination not found in this project

  /notifications/routes:
    get:
      tags:
        - Notifications
      summary: List routes
      description: Event types currently routed to team destinations, oldest first.
      operationId: listNotificationRoutes
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationRoute"
              example:
                data:
                  - id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
                    destination_id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
                    event_key: findings.detected
                    created_at: "2026-09-01T12:05:00.000000Z"
                    updated_at: "2026-09-01T12:05:00.000000Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    put:
      tags:
        - Notifications
      summary: Create or update a route
      description: |
        Routes an event type to a team destination. Every event is delivered immediately.
        Called again for the same `destination_id` and `event_key`, it returns the existing
        route. The destination may be `pending`; deliveries start once it is `active`.
        Unknown event keys and internal events return `400`.
      operationId: upsertNotificationRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination_id
                - event_key
              properties:
                destination_id:
                  type: string
                  format: uuid
                event_key:
                  type: string
                  description: A `key` from `GET /notifications/events`.
            example:
              destination_id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
              event_key: findings.detected
      responses:
        "200":
          description: Route saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationRoute"
              example:
                data:
                  id: "1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d"
                  destination_id: "6f708192-0314-42d5-b6e7-f8091a2b3c4d"
                  event_key: findings.detected
                  created_at: "2026-09-01T12:05:00.000000Z"
                  updated_at: "2026-09-01T12:05:00.000000Z"
        "400":
          description: Unknown or internal event key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                unknown:
                  value:
                    error: "Unknown notification event: findings.detectd"
                internal:
                  value:
                    error: This notification event is not available through the Platform API.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Destination not found in this project
        "422":
          description: Invalid route
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
              example:
                errors:
                  notification_destination:
                    - "must be a shared destination; personal emails follow each member's preferences"

  /notifications/routes/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete a route
      description: Deletes the route and cancels its pending deliveries.
      operationId: deleteNotificationRoute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Route removed
        "400":
          description: The route belongs to an internal event and cannot be removed through the API
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Route not found in this project

  /whatsapp/accounts/{waba_id}/funding:
    get:
      tags:
        - WhatsApp Funding
      summary: Get WABA funding status
      description: |
        Returns the current Kapso funding evidence for a WhatsApp Business Account.

        Reads persisted evidence only - no synchronous Meta request is made. `waba_id` is the
        Meta WABA ID, not a Kapso UUID. WABAs that are not visible to your project return 404.
      operationId: getWhatsappAccountFunding
      parameters:
        - name: waba_id
          in: path
          required: true
          description: Meta WhatsApp Business Account ID.
          schema:
            type: string
      responses:
        "200":
          description: Funding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFundingResponse"
              example:
                data:
                  waba_id: "4188880514714289"
                  business_portfolio_id: "1991231921410797"
                  status: not_funded
                  reason: existing_payment_method
                  message: Existing Meta payment method kept.
                  currency: USD
                  waba_currency: USD
                  last_verified_at: null
                  last_checked_at: "2026-09-13T02:45:00Z"
                  paid_messages:
                    paused: false
                    reasons: []
                  operation:
                    id: ad0d68c2-3a0d-43d9-aa41-d7bd1bc6792b
                    status: succeeded
                    started_at: "2026-09-13T02:44:00Z"
                    finished_at: "2026-09-13T02:45:00Z"
                    error_kind: null
                    meta_error_code: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags:
        - WhatsApp Funding
      summary: Ensure WABA funding
      description: |
        Verifies an external multi-partner solution account with Meta and ensures Kapso funding
        for it, without waiting for the Meta association webhook. Use it after Embedded Signup
        completes.

        Your project must have exactly one active **external** multi-partner solution; you
        cannot select a solution or project, set the WABA currency, or supply a token. When the
        membership is unknown, Kapso reads the WABA through that solution and verifies its owning
        portfolio before recording the association. Financial setup then runs in the background.

        `202` means a funding run is pending or running - it is **not** confirmation that the
        account is funded. Poll `GET /whatsapp/accounts/{waba_id}/funding` until the run reaches
        a terminal state and the funding `status` is `funded`. `200` is returned when the account
        is already funded or when no new run was started.

        Idempotent on desired state, with no `Idempotency-Key`: repeated calls reuse an
        in-progress run, and a terminal run is returned during a 30 second cooldown. After the
        cooldown a new run is started. The endpoint never resumes an explicitly disabled
        portfolio, a removed membership, or a revoked attachment - those stay explicit
        workflows.
      operationId: ensureWhatsappAccountFunding
      parameters:
        - name: waba_id
          in: path
          required: true
          description: Meta WhatsApp Business Account ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappEnsureFundingRequest"
      responses:
        "200":
          description: Already funded, or no new run was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFundingResponse"
        "202":
          description: A funding run is pending or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappFundingResponse"
              example:
                data:
                  waba_id: "109537945127015"
                  business_portfolio_id: "823380597459265"
                  status: not_funded
                  reason: null
                  message: Kapso funding is not active.
                  currency: USD
                  waba_currency: USD
                  last_verified_at: null
                  last_checked_at: null
                  paid_messages:
                    paused: false
                    reasons: []
                  operation:
                    id: ad0d68c2-3a0d-43d9-aa41-d7bd1bc6792b
                    status: pending
                    started_at: "2026-09-15T01:00:00Z"
                    finished_at: null
                    error_kind: null
                    meta_error_code: null
        "400":
          description: Missing or invalid `waba_id` or `business_portfolio_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: |
            Conflicting state: no single active external solution, funding disabled for the
            portfolio, the WABA belongs to another portfolio, project or solution, Meta did not
            confirm the association, or the membership or attachment was removed and must be
            reconnected explicitly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Meta could not verify account access. No local records are created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_kind:
                    type: string
                    nullable: true
                  meta_error_code:
                    type: integer
                    nullable: true
                  meta_trace_id:
                    type: string
                    nullable: true
              example:
                error: Meta could not verify account access. Retry later or contact support.
                error_kind: meta_unavailable
                meta_error_code: null
                meta_trace_id: null
        "503":
          description: Contention or queue unavailable. Retry the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /whatsapp/accounts/{waba_id}/usage:
    get:
      tags:
        - WhatsApp Funding
      summary: Get WABA usage
      description: |
        Returns charges recorded for this project on one WABA, broken down by usage kind
        (currently messaging and calling).

        Free messages, unposted observations, and Meta charges paid outside Kapso are excluded.
        A zero total means zero recorded charges, not proof of zero spend.
      operationId: getWhatsappAccountUsage
      parameters:
        - name: waba_id
          in: path
          required: true
          description: Meta WhatsApp Business Account ID.
          schema:
            type: string
        - name: start_time
          in: query
          required: true
          description: Inclusive start of the window, ISO 8601 with an offset or `Z`.
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: true
          description: Exclusive end of the window. At most 31 days after `start_time`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Recorded usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappBillingUsageResponse"
              example:
                data:
                  start_time: "2026-09-12T00:00:00Z"
                  end_time: "2026-09-13T00:00:00Z"
                  time_basis: recorded_at
                  currency: USD
                  charge_scope: kapso_recorded_charges
                  totals:
                    customer_charge_micro_usd: 115000
                  breakdown:
                    - usage_kind: messaging
                      customer_charge_micro_usd: 90000
                      billable_messages: 1
                      sync:
                        status: delayed
                        last_synced_at: "2026-09-12T23:30:00Z"
                        usage_through: "2026-09-12T23:25:00Z"
                    - usage_kind: calling
                      customer_charge_micro_usd: 25000
                      coverage:
                        status: supported
                        reason: null
                      sync:
                        status: synced
                        last_synced_at: null
                        usage_through: "2026-09-13T00:00:00Z"
        "400":
          description: Invalid or missing time range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Use ISO 8601 start_time and end_time, at most 31 days apart.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /whatsapp/portfolios/{portfolio_id}/accounts:
    get:
      tags:
        - WhatsApp Funding
      summary: List portfolio accounts with funding
      description: |
        Returns the WABAs in a Meta Business Portfolio that are visible to your project, each
        with its funding status. Always cursor-paginated, ordered by creation time descending.

        A listed account is not necessarily funded or currently reachable in Meta - evidence is
        kept after disconnection.
      operationId: listWhatsappPortfolioAccounts
