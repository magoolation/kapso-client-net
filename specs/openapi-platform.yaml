    WhatsappMessage:
      type: object
      description: |
        WhatsApp message in Meta-compatible format with Kapso extensions.
        The structure mirrors Meta's webhook payload format.
      required:
        - id
        - timestamp
        - type
        - kapso
      properties:
        id:
          type: string
          description: WhatsApp message ID (WAMID)
          example: wamid.HBgLMTU1NTEyMzQ1NjcVAgASGBQzQUY5
        timestamp:
          type: string
          description: Unix timestamp in seconds (as string per Meta convention)
          example: "1705329600"
        type:
          type: string
          description: Message type
          enum:
            - text
            - image
            - video
            - audio
            - document
            - location
            - interactive
            - template
            - reaction
            - contacts
            - sticker
            - button
            - order
        from:
          type:
            - string
            - "null"
          description: Sender phone number when phone-based identity is available
          example: "15551234567"
        from_user_id:
          type:
            - string
            - "null"
          description: Sender business-scoped user ID when available
          example: "US.13491208655302741918"
        from_parent_user_id:
          type:
            - string
            - "null"
          description: Sender parent business-scoped user ID when available
          example: "US.ENT.506847293015824"
        to:
          type:
            - string
            - "null"
          description: Recipient phone number when phone-based identity is available
          example: "15551234567"
        to_user_id:
          type:
            - string
            - "null"
          description: Recipient business-scoped user ID when available
          example: "US.13491208655302741918"
        to_parent_user_id:
          type:
            - string
            - "null"
          description: Recipient parent business-scoped user ID when available
          example: "US.ENT.506847293015824"
        username:
          type:
            - string
            - "null"
          description: WhatsApp username when available
          example: "@testusername"
        context:
          type: object
          description: Reply context when message is a reply
          properties:
            id:
              type: string
              description: ID of the message being replied to
            from:
              type: string
              description: Phone number of original message sender
            referred_product:
              type: object
              description: Product being referenced
              additionalProperties: true
        text:
          type: object
          description: Text message payload (when type=text)
          properties:
            body:
              type: string
        image:
          type: object
          description: Image message payload (when type=image)
          properties:
            id:
              type: string
              description: Media ID from Meta
            link:
              type: string
              format: uri
            caption:
              type: string
        video:
          type: object
          description: Video message payload (when type=video)
          properties:
            id:
              type: string
            link:
              type: string
              format: uri
            caption:
              type: string
        audio:
          type: object
          description: Audio message payload (when type=audio)
          properties:
            id:
              type: string
            link:
              type: string
              format: uri
        document:
          type: object
          description: Document message payload (when type=document)
          properties:
            id:
              type: string
            link:
              type: string
              format: uri
            filename:
              type: string
            caption:
              type: string
        location:
          type: object
          description: Location message payload (when type=location)
          properties:
            latitude:
              type: number
            longitude:
              type: number
            name:
              type: string
            address:
              type: string
        sticker:
          type: object
          description: Sticker message payload (when type=sticker)
          properties:
            id:
              type: string
            link:
              type: string
              format: uri
            mime_type:
              type: string
            animated:
              type: boolean
        interactive:
          type: object
          description: Interactive message payload (when type=interactive)
          additionalProperties: true
        button:
          type: object
          description: Button response payload (when type=button)
          properties:
            text:
              type: string
            payload:
              type: string
        template:
          type: object
          description: Template message payload (when type=template)
          properties:
            name:
              type: string
            language:
              type: object
              properties:
                code:
                  type: string
            components:
              type: array
              items:
                type: object
                additionalProperties: true
        reaction:
          type: object
          description: Reaction message payload (when type=reaction)
          properties:
            emoji:
              type: string
            message_id:
              type: string
        contacts:
          type: array
          description: Contacts message payload (when type=contacts)
          items:
            type: object
            additionalProperties: true
        order:
          type: object
          description: Order message payload (when type=order)
          properties:
            catalog_id:
              type: string
            product_items:
              type: array
              items:
                type: object
                additionalProperties: true
            order_text:
              type: string
        kapso:
          type: object
          description: Kapso-specific extensions
          required:
            - direction
            - status
            - whatsapp_conversation_id
          properties:
            direction:
              type: string
              enum:
                - inbound
                - outbound
            status:
              type: string
              enum:
                - pending
                - sent
                - delivered
                - read
                - failed
            processing_status:
              type: string
              enum:
                - pending
                - processed
                - blocked
            origin:
              type: string
              description: Message origin
              enum:
                - cloud_api
                - business_app
                - history_sync
            phone_number:
              type:
                - string
                - "null"
              description: Contact phone number
            phone_number_id:
              type:
                - string
                - "null"
              description: Meta phone number ID for the WhatsApp number
            has_media:
              type: boolean
            whatsapp_conversation_id:
              type: string
              format: uuid
              description: Kapso conversation ID
            contact_name:
              type:
                - string
                - "null"
              description: Contact name if available
            content:
              type:
                - string
                - "null"
              description: Text content of the message
            statuses:
              type: array
              description: Status event history (raw Meta payloads)
              items:
                type: object
                additionalProperties: true
            transcript:
              type: object
              description: Audio transcript (for audio messages)
              properties:
                text:
                  type: string
            media_data:
              type: object
              description: Media attachment details
              properties:
                url:
                  type: string
                  format: uri
                filename:
                  type: string
                content_type:
                  type: string
                byte_size:
                  type: integer
            media_url:
              type: string
              format: uri
              description: Direct media URL
            message_type_data:
              type: object
              description: Type-specific data (caption, template params, etc.)
              additionalProperties: true
            flow_response:
              type: object
              description: WhatsApp Flow response data
              additionalProperties: true
            flow_token:
              type: string
            flow_name:
              type: string
            order_text:
              type: string
              description: Order text for order messages

