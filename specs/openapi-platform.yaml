openapi: 3.1.0
info:
  title: Kapso Platform API
  version: 0.2.0
  description: |
    Build WhatsApp messaging into your product. Manage customers, connect phone numbers, send broadcasts, and handle conversations.

servers:
  - url: https://api.kapso.ai/platform/v1
    description: Production

security:
  - ApiKeyAuth: []

tags:
  - name: Customers
    description: Manage customer accounts
  - name: Setup Links
    description: WhatsApp onboarding via embedded signup
  - name: Phone Numbers
    description: Connect and manage WhatsApp numbers
  - name: Webhooks
    description: Subscribe to WhatsApp events
  - name: Display Names
    description: Update WhatsApp business display names
  - name: Broadcasts
    description: |
      Send template messages at scale

      **Alpha**: This API is in alpha and subject to change
  - name: Conversations
    description: Manage conversation state
  - name: Media
    description: Upload media files for WhatsApp messaging
  - name: Users
    description: Manage project team members
  - name: Inbox Embeds
    description: Create and manage embeddable inbox access links
  - name: Webhook Deliveries
    description: View webhook delivery attempts and their status
  - name: External API Logs
    description: View logs of external API calls made by the project
  - name: Log Search
    description: Search log events across API, Meta, workflow, and webhook sources
  - name: Events
    description: Emit and query project-scoped events
  - name: Provider Models
    description: List available AI provider models
  - name: WhatsApp Flows
    description: Build interactive WhatsApp Flows for surveys and forms
  - name: Contacts
    description: Manage WhatsApp contacts
  - name: Findings
    description: Detect recurring problems in conversations and investigate them with AI
  - name: Notifications
    description: Route project alerts to shared inboxes and Slack channels connected from the Kapso app
  - name: WhatsApp Funding
    description: Read Kapso funding status and recorded messaging and calling usage, and stop portfolio funding

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    NotificationEventType:
      type: object
      properties:
        key:
          type: string
          description: Stable identifier used when creating routes, e.g. `findings.detected`.
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [account, billing, usage, whatsapp, workflow, agent, integration, security, reports, product, findings]
        severity:
          type: string
          enum: [info, warning, error, critical]
        supported_channels:
          type: array
          items:
            type: string
            enum: [email, slack]
        data_contract:
          type: object
          description: |
            Fields the event payload may carry. Every event accepts `title`, `message`,
            `resource_name`, `details`, and `occurred_at`; `kapso_agent.*` events also carry
            `agent_run_id`.
          properties:
            required:
              type: array
              items:
                type: string
            optional:
              type: array
              items:
                type: string
        surface_path_template:
          type: string
          description: Kapso app path the notification links to, with `%<project_id>s` interpolated.

    NotificationDestination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [shared_email, slack_channel]
        label:
          type: string
          nullable: true
          description: Display name. For `slack_channel` destinations this is the channel name.
        status:
          type: string
          enum: [pending, active, unhealthy]
          description: |
            A `shared_email` destination is created as `pending` and becomes `active` once the
            recipient opens the verification link. Slack destinations are `active` on creation
            and become `unhealthy` when the channel can no longer be posted to. Removed
            destinations are disabled and no longer listed.
        channel:
          type: string
          enum: [email, slack]
        address:
          type: string
          description: Email address, or Slack channel ID for `slack_channel` destinations.
        verified_at:
          type: string
          format: date-time
          nullable: true
        slack_channel_binding_id:
          type: string
          format: uuid
          nullable: true
          description: Kapso Agent channel binding, or `null` for channels connected only for notifications.
        workspace_name:
          type: string
          nullable: true
          description: Slack workspace name, when the destination is a Slack channel.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Always `null` for team destinations.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        destination_id:
          type: string
          format: uuid
        event_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FindingsErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          enum: [findings_not_enabled, finding_not_found, investigation_unavailable]
          description: |
            Machine-readable reason. Present on both `404` cases and on an ineligible
            investigation. Absent on validation and pagination errors.

    FindingSummaryInvestigation:
      type: object
      required:
        - status
        - retryable
        - retry_reason
        - completed_at
        - error_message
        - cause_title
        - summary
      properties:
        status:
          type: string
          enum: [queued, investigating, completed, failed, timed_out]
        retryable:
          type: boolean
          description: Whether a new investigation can be started for this finding.
        retry_reason:
          type:
            - string
            - "null"
          description: Why a retry is available, when it is.
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        error_message:
          type:
            - string
            - "null"
          description: Truncated to 200 characters.
        cause_title:
          type:
            - string
            - "null"
          description: Title of the top cause, truncated to 100 characters.
        summary:
          type:
            - string
            - "null"
          description: Investigation summary, truncated to 200 characters.

    FindingSummaryVerification:
      type: object
      required:
        - status
        - trigger_type
        - completed_at
      properties:
        status:
          type: string
          enum: [monitoring, resolved, not_improved, dismissed]
        trigger_type:
          type: string
          enum: [workflow_version, regression, manual]
        completed_at:
          type:
            - string
            - "null"
          format: date-time

    FindingSummary:
      type: object
      required:
        - id
        - signal_name
        - direction
        - status
        - affected_count
        - affected_unit
        - last_observed_at
        - related_findings_count
        - investigation
        - verification
      properties:
        id:
          type: string
          format: uuid
        signal_name:
          type: string
          description: Project event name behind the finding.
          example: conversation.user_frustrated
        direction:
          type: string
          enum: [rising, falling, recurring]
        status:
          type: string
          enum: [candidate, open]
          description: |
            Listing only returns `candidate` and `open` findings. Quiet findings are
            reachable through `GET /findings/{finding_id}`.
        affected_count:
          type: integer
        affected_unit:
          type: string
          enum: [conversations, events]
        last_observed_at:
          type: string
          format: date-time
        related_findings_count:
          type: integer
          description: Number of other findings grouped with this one.
        investigation:
          oneOf:
            - $ref: "#/components/schemas/FindingSummaryInvestigation"
            - type: "null"
        verification:
          oneOf:
            - $ref: "#/components/schemas/FindingSummaryVerification"
            - type: "null"

    FindingListResponse:
      type: object
      required:
        - data
        - paging
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FindingSummary"
        paging:
          type: object
          required:
            - cursors
            - next
            - previous
          properties:
            cursors:
              type: object
              required:
                - before
                - after
              properties:
                before:
                  type:
                    - string
                    - "null"
                  description: Opaque cursor (Base64 encoded) for the first item on this page.
                after:
                  type:
                    - string
                    - "null"
                  description: Opaque cursor (Base64 encoded) for the last item on this page.
            next:
              type:
                - string
                - "null"
              description: |
                Opaque cursor, not a URL. Pass it back as `after` to fetch the next page.
                `null` when this is the last page.
            previous:
              type:
                - string
                - "null"
              description: |
                Opaque cursor, not a URL. Pass it back as `before` to fetch the previous page.
                `null` when this is the first page.

    FindingEvidenceReference:
      type: object
      required:
        - source_type
        - source_id
        - observation
        - occurred_at
      properties:
        source_type:
          type: string
        source_id:
          type:
            - string
            - "null"
        observation:
          type:
            - string
            - "null"
        occurred_at:
          type:
            - string
            - "null"
          format: date-time

    FindingCause:
      type: object
      required:
        - title
        - explanation
        - confidence
        - evidence_references
      properties:
        title:
          type: string
        explanation:
          type: string
        confidence:
          type: string
          enum: [low, medium, high]
        evidence_references:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceReference"

    FindingSuggestedFix:
      type: object
      required:
        - title
        - priority
        - category
        - change
        - verification
        - target
        - evidence_references
      properties:
        title:
          type: string
        priority:
          type: string
          enum: [primary, secondary]
          description: Exactly one suggested fix per investigation is `primary`.
        category:
          type: string
          enum: [workflow, code, evaluation, configuration]
          description: What kind of thing has to change.
        change:
          type: string
          description: What to change.
        verification:
          type: string
          description: How to verify the fix.
        target:
          type: object
          required:
            - name
            - location
          properties:
            name:
              type:
                - string
                - "null"
            location:
              type:
                - string
                - "null"
        evidence_references:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceReference"

    FindingInvestigationResult:
      type: object
      required:
        - summary
        - alternative_explanations
        - coverage_limitations
        - affected_components
        - causes
        - suggested_fixes
      properties:
        summary:
          type:
            - string
            - "null"
        alternative_explanations:
          type:
            - array
            - "null"
          items:
            type: string
        coverage_limitations:
          type:
            - array
            - "null"
          items:
            type: string
        affected_components:
          type:
            - array
            - "null"
          items:
            type: string
        causes:
          type: array
          items:
            $ref: "#/components/schemas/FindingCause"
        suggested_fixes:
          type: array
          items:
            $ref: "#/components/schemas/FindingSuggestedFix"
        change_since_previous:
          type: object
          description: |
            Present when the investigation was a retry that only looked at evidence newer than
            the previous investigation. Describes how the conclusion changed.
          required:
            - explanation
          properties:
            status:
              type: string
              enum:
                - not_applicable
                - unchanged
                - narrowed
                - revised
                - replaced
                - insufficient_evidence
            explanation:
              type: string
              maxLength: 300

    FindingInvestigation:
      type: object
      required:
        - id
        - status
        - retryable
        - retry_reason
        - error_message
        - created_at
        - completed_at
        - workflow_id
        - workflow_name
        - result
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, investigating, completed, failed, timed_out]
        retryable:
          type: boolean
        retry_reason:
          type:
            - string
            - "null"
        error_message:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        workflow_id:
          type:
            - string
            - "null"
          format: uuid
        workflow_name:
          type:
            - string
            - "null"
        result:
          $ref: "#/components/schemas/FindingInvestigationResult"

    FindingVerification:
      type: object
      required:
        - id
        - status
        - trigger_type
        - from_workflow_version
        - to_workflow_version
        - started_at
        - completed_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [monitoring, resolved, not_improved, dismissed]
        trigger_type:
          type: string
          enum: [workflow_version, regression, manual]
        from_workflow_version:
          type:
            - integer
            - "null"
        to_workflow_version:
          type:
            - integer
            - "null"
        started_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time

    RelatedFinding:
      type: object
      required:
        - id
        - source_type
        - source_key
        - signal_name
        - direction
        - affected_count
        - baseline_count
        - current_rate
        - baseline_rate
        - window_start_at
        - window_end_at
        - affected_unit
        - evidence_revision
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [project_event]
        source_key:
          type: string
        signal_name:
          type: string
        direction:
          type: string
          enum: [rising, falling, recurring]
        affected_count:
          type: integer
        baseline_count:
          type:
            - integer
            - "null"
        current_rate:
          type:
            - number
            - "null"
          description: Share of conversations in the current window, from 0 to 1.
        baseline_rate:
          type:
            - number
            - "null"
        window_start_at:
          type: string
          format: date-time
        window_end_at:
          type: string
          format: date-time
        affected_unit:
          type: string
          enum: [conversations, events]
        evidence_revision:
          type: integer

    FindingDetail:
      type: object
      required:
        - id
        - source_type
        - source_key
        - signal_name
        - direction
        - status
        - affected_count
        - baseline_count
        - current_rate
        - baseline_rate
        - evidence_revision
        - last_observed_at
        - window_start_at
        - window_end_at
        - last_qualified_at
        - affected_unit
        - workflow_id
        - workflow_name
        - verification
        - related_findings
        - investigation
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [project_event]
        source_key:
          type: string
        signal_name:
          type: string
        direction:
          type: string
          enum: [rising, falling, recurring]
        status:
          type: string
          enum: [candidate, open, quiet]
        affected_count:
          type: integer
        baseline_count:
          type:
            - integer
            - "null"
        current_rate:
          type:
            - number
            - "null"
          description: Share of conversations in the current window, from 0 to 1.
        baseline_rate:
          type:
            - number
            - "null"
        evidence_revision:
          type: integer
          description: Increments when new qualifying evidence arrives.
        last_observed_at:
          type: string
          format: date-time
        window_start_at:
          type: string
          format: date-time
        window_end_at:
          type: string
          format: date-time
        last_qualified_at:
          type: string
          format: date-time
        affected_unit:
          type: string
          enum: [conversations, events]
        workflow_id:
          type:
            - string
            - "null"
          format: uuid
        workflow_name:
          type:
            - string
            - "null"
        verification:
          oneOf:
            - $ref: "#/components/schemas/FindingVerification"
            - type: "null"
        related_findings:
          type: array
          items:
            $ref: "#/components/schemas/RelatedFinding"
        investigation:
          oneOf:
            - $ref: "#/components/schemas/FindingInvestigation"
            - type: "null"

    FindingDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/FindingDetail"

    FindingEvidenceFinding:
      type: object
      required:
        - id
        - source_type
        - source_key
        - signal_name
        - direction
        - status
        - window_start_at
        - window_end_at
        - affected_count
        - baseline_count
        - current_rate
        - baseline_rate
        - last_observed_at
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [project_event]
        source_key:
          type: string
        signal_name:
          type: string
        direction:
          type: string
          enum: [rising, falling, recurring]
        status:
          type: string
          enum: [candidate, open, quiet]
        window_start_at:
          type: string
          format: date-time
        window_end_at:
          type: string
          format: date-time
        affected_count:
          type: integer
        baseline_count:
          type:
            - integer
            - "null"
        current_rate:
          type:
            - number
            - "null"
        baseline_rate:
          type:
            - number
            - "null"
        last_observed_at:
          type: string
          format: date-time

    FindingEvidenceEventDefinition:
      type: object
      required:
        - id
        - name
        - display_name
        - description
        - property_schema
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        property_schema:
          type:
            - object
            - "null"
          additionalProperties: true

    FindingEvidenceDailyHistoryEntry:
      type: object
      required:
        - bucket_on
        - event_count
        - conversation_count
      properties:
        bucket_on:
          type: string
          format: date
        event_count:
          type: integer
        conversation_count:
          type: integer

    FindingEvidenceSourceEvent:
      type: object
      required:
        - id
        - name
        - observed_at
        - occurred_at
        - conversation_id
        - properties
        - whatsapp_config
        - source_workflow
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        observed_at:
          type: string
          format: date-time
          description: When Kapso recorded the evidence. Used to order retry deltas.
        occurred_at:
          type: string
          format: date-time
        conversation_id:
          type:
            - string
            - "null"
          format: uuid
        properties:
          type: object
          description: Flat event properties object.
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
        whatsapp_config:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            kind:
              type: string
            name:
              type:
                - string
                - "null"
            business_phone_number:
              type:
                - string
                - "null"
            meta_phone_number_id:
              type:
                - string
                - "null"
        source_workflow:
          type:
            - object
            - "null"
          properties:
            workflow_id:
              type:
                - string
                - "null"
              format: uuid
            execution_id:
              type:
                - string
                - "null"
              format: uuid
            snapshot_id:
              type:
                - string
                - "null"
              format: uuid
            snapshot_version:
              type:
                - integer
                - "null"
            test_mode:
              type:
                - boolean
                - "null"

    FindingEvidenceCoOccurringEvent:
      type: object
      required:
        - name
        - event_count
      properties:
        name:
          type: string
        event_count:
          type: integer
        observed_at:
          type: string
          format: date-time
          description: Only present on retry deltas.

    FindingEvidenceDeltaItem:
      type: object
      description: One piece of evidence recorded after the previous investigation ran.
      required:
        - id
        - observed_at
        - source_type
        - new_since_previous
      properties:
        id:
          type: string
          format: uuid
        observed_at:
          type: string
          format: date-time
        source_type:
          type: string
          enum:
            - project_event
            - conversation
        new_since_previous:
          type: boolean

    FindingEvidenceSummary:
      type: object
      required:
        - cutoff
        - new_item_count
      properties:
        cutoff:
          type:
            - string
            - "null"
          format: date-time
          description: Evidence recorded at or before this time was already investigated.
        new_item_count:
          type: integer

    FindingEvidenceCoverage:
      type: object
      description: How much of the underlying evidence this response contains.
      required:
        - source_event_count
        - source_events_returned
        - affected_conversations_returned
        - comparison_conversations_returned
        - source_event_limit
        - affected_conversation_limit
        - comparison_conversation_limit
        - note
      properties:
        source_event_count:
          type: integer
        source_events_returned:
          type: integer
        affected_conversations_returned:
          type: integer
        comparison_conversations_returned:
          type: integer
        source_event_limit:
          type: integer
        affected_conversation_limit:
          type: integer
        comparison_conversation_limit:
          type: integer
        note:
          type:
            - string
            - "null"
        cutoff:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Only present on retry deltas. Evidence recorded at or before this time was already
            covered by the previous investigation.
        freshness:
          type: string
          description: Only present on retry deltas. How the cutoff is applied per source type.

    FindingEvidenceGroup:
      type: object
      description: Evidence for one finding grouped with the requested one.
      required:
        - finding
        - event_definition
        - daily_history
        - source_events
        - affected_conversation_ids
        - co_occurring_events
      properties:
        finding:
          $ref: "#/components/schemas/FindingEvidenceFinding"
        event_definition:
          oneOf:
            - $ref: "#/components/schemas/FindingEvidenceEventDefinition"
            - type: "null"
        daily_history:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceDailyHistoryEntry"
        source_events:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceSourceEvent"
        affected_conversation_ids:
          type: array
          items:
            type: string
            format: uuid
        co_occurring_events:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceCoOccurringEvent"
        new_evidence:
          type: array
          description: Only present on retry deltas.
          items:
            $ref: "#/components/schemas/FindingEvidenceDeltaItem"
        historical_context:
          type: array
          description: Only present on retry deltas. Currently always empty.
          items: {}
        evidence_summary:
          $ref: "#/components/schemas/FindingEvidenceSummary"

    FindingEvidence:
      type: object
      required:
        - finding
        - event_definition
        - coverage
        - workflow
        - daily_history
        - source_events
        - affected_conversation_ids
        - comparison_conversation_ids
        - co_occurring_events
        - grouped_findings
        - evidence_by_finding
      properties:
        finding:
          $ref: "#/components/schemas/FindingEvidenceFinding"
        event_definition:
          oneOf:
            - $ref: "#/components/schemas/FindingEvidenceEventDefinition"
            - type: "null"
        coverage:
          $ref: "#/components/schemas/FindingEvidenceCoverage"
        workflow:
          type:
            - object
            - "null"
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        daily_history:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceDailyHistoryEntry"
        source_events:
          type: array
          items:
            $ref: "#/components/schemas/FindingEvidenceSourceEvent"
        affected_conversation_ids:
          type: array
          items:
