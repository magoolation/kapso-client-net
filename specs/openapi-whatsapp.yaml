            type: string
        - name: business_account_id
          in: query
          required: false
          description: Required when accessing flow by ID (unless phone_number_id provided)
          schema:
            type: string
      responses:
        "200":
          description: Flow details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
