  /whatsapp/phone_numbers/{phone_number_id}/health:
    parameters:
      - name: phone_number_id
        in: path
        required: true
        schema:
          type: string

    get:
      tags:
        - Phone Numbers
      summary: Check phone health
      description: |
        Health check via Meta APIs and Kapso services.

        Results are cached for 3 minutes per phone number, so repeated calls can
        return the same payload. Use `timestamp` to tell when the check actually
        ran. The cache is invalidated early when the number's configuration
        changes.

        If a fresh check is already running for the same number and does not
        finish within 15 seconds, the response is `status: error` with an
        `error` message asking you to retry shortly.

        When a check keeps failing to read the phone number from Meta because of
        an access or token error, the result is held for longer: 5, then 15, then
        30, then 60 minutes. During that window the response repeats the last
        payload and adds `retry_after`. Rate limits, payment errors and transport
        failures do not trigger this. A successful check clears `retry_after` and
        resets the delay, as does reconnecting the number or changing its
        credentials.

        When Meta reports the number as `DISCONNECTED`, the overall `status` is
        `unhealthy` even if the other checks pass. Reconnect the number to
        restore messaging. A missing or unrecognized connection status is
        reported as `UNKNOWN` and does not affect the overall status.

        Health checks are limited to 5 requests per second and 60 requests per
        minute per project, shared across all API keys in the project. Over the
        limit the request is rejected with `429` before Meta is called, and
        `Retry-After` tells you how many seconds to wait. Every response carries
        the current counters in the `X-Health-RateLimit-*` headers.
      operationId: getWhatsappPhoneNumberHealth
      responses:
        "200":
          description: Health status
          headers:
            X-Health-RateLimit-Second-Limit:
              description: Requests allowed per second for this project
              schema:
                type: integer
            X-Health-RateLimit-Second-Remaining:
              description: Requests left in the current second
              schema:
                type: integer
            X-Health-RateLimit-Minute-Limit:
              description: Requests allowed per minute for this project
              schema:
                type: integer
            X-Health-RateLimit-Minute-Remaining:
              description: Requests left in the current minute
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappPhoneNumberHealthResponse"
              examples:
                healthy:
                  summary: All checks pass
                  value:
                    status: healthy
                    timestamp: "2025-01-20T14:25:30Z"
                    checks:
                      phone_number_access:
                        passed: true
                        details:
                          verified_name: My Business
                          display_phone_number: "+1 555-123-4567"
                          quality_rating: GREEN
                          status: CONNECTED
                          throughput_tier: TIER_10K
                          id: "123456789012345"
                      phone_number_connection:
                        passed: true
                        details:
                          status: CONNECTED
                      messaging_health:
                        passed: true
                        overall_status: AVAILABLE
                        details:
                          can_send_message: AVAILABLE
                          entities:
                            - entity_type: PHONE_NUMBER
                              id: "123456789012345"
                              can_send_message: AVAILABLE
                            - entity_type: WABA
                              id: "987654321098765"
                              can_send_message: AVAILABLE
                            - entity_type: BUSINESS
                              id: "456789012345678"
                              can_send_message: AVAILABLE
                            - entity_type: APP
                              id: "789012345678901"
                              can_send_message: AVAILABLE
                      webhook_subscription:
                        passed: true
                        details:
                          app_id: "789012345678901"
                          subscribed: true
                          subscribed_fields:
                            - messages
                            - message_template_status_update
                      webhook_verified:
                        passed: true
                        details:
                          verified_at: "2025-01-15T10:30:00Z"
                          message: Webhook successfully verified at 2025-01-15 10:30:00 UTC
                degraded:
                  summary: Limited messaging or webhook issues
                  value:
                    status: degraded
                    timestamp: "2025-01-15T10:00:00Z"
                    checks:
                      phone_number_access:
                        passed: true
                        details:
                          verified_name: Acme Corp
                          display_phone_number: "+1 555-123-4567"
                          quality_rating: GREEN
                          status: CONNECTED
                          throughput_tier: TIER_10K
                      messaging_health:
                        passed: false
                        overall_status: LIMITED
                        details:
                          can_send_message: LIMITED
                          entities:
                            - entity_type: PHONE_NUMBER
                              id: "1234567890"
                              can_send_message: LIMITED
                              additional_info:
                                - There is an issue with the payment method.
                                  Template sending and business-initiated
                                  conversations are blocked.
                                - You can still send and receive messages within
                                  the 24-hour window.
                      webhook_subscription:
                        passed: true
                        details:
                          app_id: "123456789"
                          subscribed: true
                          subscribed_fields:
                            - messages
                      webhook_verified:
                        passed: false
                        details:
                          verified_at: null
                          message: Webhook not yet verified by Meta
                unhealthy_payment_method:
                  summary: Payment method error (Meta billing issue)
                  description: Must be resolved in Meta Business Manager, not in Kapso
                  value:
                    status: unhealthy
                    timestamp: "2025-01-20T16:45:15Z"
                    checks:
                      phone_number_access:
                        passed: true
                        details:
                          verified_name: Demo Company
                          display_phone_number: "+1 555-987-6543"
                          quality_rating: GREEN
                          status: CONNECTED
                          throughput_tier: TIER_10K
                          id: "998877665544332"
                      messaging_health:
                        passed: false
                        overall_status: BLOCKED
                        details:
                          can_send_message: BLOCKED
                          entities:
                            - entity_type: PHONE_NUMBER
                              id: "998877665544332"
                              can_send_message: LIMITED
                              additional_info:
                                - Your display name has not been approved yet.
                                  Your message limit will increase after the
                                  display name is approved.
                            - entity_type: WABA
                              id: "556677889900112"
                              can_send_message: BLOCKED
                              errors:
                                - error_code: "141006"
                                  error_description: There is an error with the payment method. This will block
                                    business initiated conversations.
                                  possible_solution: There was an error with your payment method. Please add a new
                                    payment method to the account.
                            - entity_type: BUSINESS
                              id: "334455667788990"
                              can_send_message: LIMITED
                            - entity_type: APP
                              id: "112233445566778"
                              can_send_message: AVAILABLE
                      webhook_subscription:
                        passed: true
                        details:
                          app_id: "112233445566778"
                          subscribed: true
                          subscribed_fields:
                            - messages
                      webhook_verified:
                        passed: false
                        details:
                          verified_at: null
                          message: Webhook not yet verified by Meta
                unhealthy_disconnected:
                  summary: Number disconnected from Meta
                  description: Reconnect the number to restore messaging
                  value:
                    status: unhealthy
                    timestamp: "2026-09-17T09:12:00Z"
                    checks:
                      phone_number_access:
                        passed: true
                        details:
                          verified_name: Demo Company
                          display_phone_number: "+1 555-987-6543"
                          quality_rating: GREEN
                          status: DISCONNECTED
                          throughput_tier: TIER_10K
                          id: "998877665544332"
                      phone_number_connection:
                        passed: false
                        details:
                          status: DISCONNECTED
                      messaging_health:
                        passed: true
                        overall_status: AVAILABLE
                        details:
                          can_send_message: AVAILABLE
                          entities:
                            - entity_type: PHONE_NUMBER
                              id: "998877665544332"
                              can_send_message: AVAILABLE
                      webhook_subscription:
                        passed: true
                        details:
                          app_id: "112233445566778"
                          subscribed: true
                          subscribed_fields:
                            - messages
                      webhook_verified:
                        passed: true
                        details:
                          verified_at: "2026-09-01T08:15:30Z"
                          message: Webhook successfully verified at 2026-09-01 08:15:30 UTC
                unhealthy_invalid_token:
                  summary: Invalid OAuth token
                  description: User needs to reconnect WhatsApp Business Account
                  value:
                    status: unhealthy
                    timestamp: "2025-01-20T18:22:45Z"
                    retry_after: "2025-01-20T18:27:45Z"
                    checks:
                      phone_number_access:
                        passed: false
                        error: 'Meta Graph API error: 400 - {"error" => {"message" => "Invalid OAuth
                          access token - Cannot parse access token", "type" =>
                          "OAuthException", "code" => 190, "fbtrace_id" =>
                          "ABC123xyz456"}}'
                      messaging_health:
                        passed: false
                        error: 'Meta Graph API error: 400 - {"error" => {"message" => "Invalid OAuth
                          access token - Cannot parse access token", "type" =>
                          "OAuthException", "code" => 190, "fbtrace_id" =>
                          "DEF789abc012"}}'
                      webhook_subscription:
                        passed: false
                        error: 'Meta Graph API error: 401 - {"error" => {"message" => "Invalid OAuth
                          access token - Cannot parse access token", "type" =>
                          "OAuthException", "code" => 190, "fbtrace_id" =>
                          "GHI345def678"}}'
                      webhook_verified:
                        passed: true
                        details:
                          verified_at: "2025-01-10T08:15:30Z"
                          message: Webhook successfully verified at 2025-01-10 08:15:30 UTC
                error_response:
                  summary: Health check service error
                  value:
                    status: error
                    error: Service temporarily unavailable
                    timestamp: "2025-01-20T10:00:00Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "429":
          description: Health check rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
            X-Health-RateLimit-Second-Limit:
              schema:
                type: integer
            X-Health-RateLimit-Second-Remaining:
              schema:
                type: integer
            X-Health-RateLimit-Minute-Limit:
              schema:
                type: integer
            X-Health-RateLimit-Minute-Remaining:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rate_limited:
                  value:
                    error: "Rate limit exceeded"
                    message: "WhatsApp health checks are limited to 5 requests per second and 60 requests per minute per project."

  /whatsapp/phone_numbers/{phone_number_id}/webhooks:
    parameters:
      - name: phone_number_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Webhooks
      summary: List webhooks
      description: Get webhooks for this number, most recent first.
      operationId: listWhatsappPhoneNumberWebhooks
      parameters:
        - name: url_contains
          in: query
          description: Filter by URL substring
          schema:
            type: string
        - name: kind
          in: query
          description: Filter by webhook kind
          schema:
            type: string
            enum:
              - kapso
              - meta
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: OK
          headers:
            X-Total:
              schema:
                type: integer
            X-Total-Pages:
              schema:
                type: integer
            X-Per-Page:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            Link:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappWebhookListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags:
        - Webhooks
      summary: Create webhook
      description: |
        Subscribe to WhatsApp events for this number.

        Two webhook types available:
        - **kapso**: Event-based webhooks with filtered events, buffering support, and Kapso payload format
        - **meta**: Raw Meta webhook forwarding - receives the exact payload Meta sends, with X-Idempotency-Key header

        Use buffering (kapso only) to batch high-volume events like inbound messages. Without buffering, each message triggers an immediate webhook delivery.
      operationId: createWhatsappPhoneNumberWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappWebhookRequest"
            examples:
              basic:
                summary: No buffering
                value:
                  whatsapp_webhook:
                    url: https://api.acme.com/webhooks/whatsapp
                    secret_key: wh_sec_3kfj9dmfkg8s2
                    events:
                      - whatsapp.message.received
                      - whatsapp.message.sent
                    active: true
              buffered:
                summary: Batch inbound messages
                value:
                  whatsapp_webhook:
                    url: https://api.acme.com/webhooks/whatsapp
                    secret_key: wh_sec_3kfj9dmfkg8s2
                    events:
                      - whatsapp.message.received
                      - whatsapp.message.sent
                    buffer_enabled: true
                    buffer_window_seconds: 10
                    max_buffer_size: 25
                    buffer_events:
                      - whatsapp.message.received
                    headers:
                      X-Webhook-Source: kapso
              with_inactivity:
                summary: Track conversation inactivity
                value:
                  whatsapp_webhook:
                    url: https://api.acme.com/webhooks/whatsapp
                    secret_key: wh_sec_3kfj9dmfkg8s2
                    events:
                      - whatsapp.message.received
                      - whatsapp.conversation.inactive
                    inactivity_minutes: 30
              meta_forward:
                summary: Forward raw Meta webhooks
                value:
                  whatsapp_webhook:
                    kind: meta
                    url: https://api.acme.com/webhooks/whatsapp-meta
                    secret_key: your-signing-secret
                    active: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsappWebhookResponse"
              examples:
                created:
                  value:
                    data:
                      id: 9e8d7c6b-5a4f-3e2d-1c0b-9a8f7e6d5c4b
                      url: https://api.acme.com/webhooks/whatsapp
                      events:
                        - whatsapp.message.received
                        - whatsapp.message.sent
                      active: true
                      secret_key: wh_sec_3kfj9dmfkg8s2
                      headers:
                        X-Webhook-Source: kapso
                      buffer_enabled: false
                      buffer_window_seconds: null
                      max_buffer_size: null
                      buffer_events: []
                      inactivity_minutes: 60
                      project_id: 1d6ca0a3-91c2-4f13-8a94-28ddb0d5f2f3
                      phone_number_id: "1234567890"
                      created_at: "2025-07-14T15:00:00Z"
                      updated_at: "2025-07-14T15:00:00Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

