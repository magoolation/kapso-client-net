    WhatsappPhoneNumberHealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
            - error
        timestamp:
          type: string
          format: date-time
        retry_after:
          type: string
          format: date-time
          description: |
            Present only while the number is in access-error backoff. The earliest
            time a later request will re-check Meta. Requests made before this time
            return this same cached payload. It is not a scheduled re-check or a
            guarantee that the next check will succeed.
        error:
          type:
            - string
            - "null"
        checks:
          type:
            - object
            - "null"
          additionalProperties:
            type: object
            properties:
              passed:
                type:
                  - boolean
                  - "null"
              details:
                type: object
                additionalProperties: true
              error:
                type: string
          description: |
            Individual check results. Typical checks:
            - phone_number_access: Meta API connectivity
            - phone_number_connection: Meta connection status (CONNECTED/DISCONNECTED/UNKNOWN). `passed` is `null` when the status is UNKNOWN
            - messaging_health: Send/receive capability (AVAILABLE/LIMITED/BLOCKED)
            - webhook_subscription: WABA app subscription status
            - webhook_verified: Webhook verification status
            - token_validity: Access token validity (coexistence only)

