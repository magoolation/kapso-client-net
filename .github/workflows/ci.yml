name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from tags, and a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      # Release turns warnings into errors, which is the gate that matters.
      - run: dotnet build -c Release --no-restore

      - run: dotnet test --project tests/Kapso.Tests -c Release --no-build

      - run: dotnet pack src/Kapso -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  generated-code:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Regenerating from the committed descriptions must reproduce exactly what
      # is committed. If it does not, someone hand-edited generated code or
      # forgot to regenerate after a spec change.
      - run: pwsh eng/Generate-Clients.ps1

      # A file excluded by .gitignore is invisible to the diff check below: it is
      # never committed, so there is nothing to differ from. It only surfaces as a
      # compile error on a clean checkout, which is how the Publish/ directories
      # were lost to the .NET template's [Pp]ublish/ rule.
      - name: Fail if any generated file is git-ignored
        run: |
          # kiota-lock.json is ignored on purpose: its descriptionHash is not
          # stable across platforms. See .gitignore.
          ignored=$(git ls-files --others --ignored --exclude-standard -- src/Kapso/Generated | grep -v 'kiota-lock.json' || true)
          if [ -n "$ignored" ]; then
            echo "::error::These generated files are excluded by .gitignore and would be missing from a clean checkout:"
            echo "$ignored"
            exit 1
          fi

      - name: Fail if the generated client differs
        run: |
          if ! git diff --exit-code --stat -- src/Kapso/Generated; then
            echo "::error::src/Kapso/Generated is out of date. Run: pwsh eng/Generate-Clients.ps1"
            git diff -- src/Kapso/Generated | head -200
            exit 1
          fi

  samples:
    name: Samples
    runs-on: ubuntu-latest
    # Declared at job level so the step conditions below can see it. A step's own
    # env block is not in scope when its `if` is evaluated.
    env:
      KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Not `dotnet build samples`: that directory holds four projects and no
      # solution, so MSBuild has nothing to open.
      - run: dotnet build Kapso.slnx -c Release

      # Proves the webhook path end to end with no Kapso account: the sample signs
      # a delivery, posts it to itself, and checks that a valid one is accepted and
      # a forged or altered one is rejected.
      - name: Webhook receiver self-test
        run: dotnet run --project samples/Kapso.Samples.WebhookReceiver -c Release --no-build -- --selftest

      # Runs only where a key is available — a fork's pull request has none, and
      # must not fail for it. Read-only: it creates and sends nothing.
      - name: Read-only tour against the live API
        if: ${{ env.KAPSO_API_KEY != '' }}
        run: dotnet run --project samples/Kapso.Samples.Quickstart -c Release --no-build

  secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh eng/Test-NoSecrets.ps1

  aot:
    name: Native AOT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Turns the AOT and trimming claims into something checked. The sample
      # touches every hand-written surface, and its project treats any trim or
      # AOT warning as an error.
      - run: dotnet publish samples/Kapso.Samples.Aot -c Release -r linux-x64

      - name: Run the native binary
        run: ./samples/Kapso.Samples.Aot/bin/Release/net10.0/linux-x64/publish/Kapso.Samples.Aot

  spec-drift:
    name: Upstream specs unchanged
    runs-on: ubuntu-latest
    # Informational: Kapso changing its API should not fail a pull request that
    # has nothing to do with it. The scheduled sync-specs workflow opens a PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: pwsh eng/Sync-Specs.ps1 -Check
