            and failed_count.
        responded_count:
          type: integer
          minimum: 0
          description: Responses
        response_rate:
          type: number
          format: float
          description: Response rate %
        total_recipients:
          type: integer
          minimum: 0
          description: Total recipients
        phone_number_id:
          type:
            - string
            - "null"
          description: Phone number ID
        whatsapp_template:
          anyOf:
            - $ref: "#/components/schemas/WhatsappBroadcastTemplate"
            - type: "null"

