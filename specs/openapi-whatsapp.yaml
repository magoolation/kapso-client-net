  /{phone_number_id}/thread_control:
    parameters:
      - name: phone_number_id
        in: path
        required: true
        description: WhatsApp Business Phone Number ID
        schema:
          type: string
        example: "110987654321"
    post:
      tags:
        - Conversations
      summary: Pass, release or take a conversation
      description: |
        Move a conversation between apps on a [shared number](/docs/whatsapp/conversation-routing).

        **Proxy endpoint**: The body is forwarded to Meta unchanged and Meta's response is returned
        unchanged. Kapso records the call and updates the conversation's routing state.

        Only your escalation app can `take`. Kapso never retries: a `502` means the result is
        unknown and the action may have gone through.
      operationId: threadControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messaging_product
                - action
              anyOf:
                - required:
                    - to
                - required:
                    - recipient
              properties:
                messaging_product:
                  type: string
                  enum:
                    - whatsapp
                action:
                  type: string
                  enum:
                    - take
                    - release
                    - pass
                to:
                  type: string
                  description: Customer phone number. Use `to` or `recipient`.
                  example: "15551234567"
                recipient:
                  type: string
                  description: Customer business-scoped user ID. Use `to` or `recipient`.
                  example: US.13491208655302741918
                control_pass:
                  type: object
                  description: Pass only. Without it, the conversation goes to the escalation app.
                  properties:
                    target_role:
                      type: string
                      enum:
                        - escalation
                        - ai_agent
                        - customer_service
                        - marketing
                        - utility
                        - ctwa
                metadata:
                  type: string
                  maxLength: 2000
                  description: Passed to the app that receives the conversation.
            examples:
              pass:
                summary: Pass to the escalation app
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  action: pass
                  control_pass:
                    target_role: escalation
                  metadata: Customer asked for a human
              take:
                summary: Take the conversation
                value:
                  messaging_product: whatsapp
                  recipient: US.13491208655302741918
                  action: take
              release:
                summary: Release the conversation
                value:
                  messaging_product: whatsapp
                  to: "15551234567"
                  action: release
      responses:
        "200":
          description: Meta accepted the action
          content:
            application/json:
              schema:
                type: object
                properties:
                  messaging_product:
                    type: string
                    example: whatsapp
                  request_id:
                    type: string
                    description: Present when Meta returns it
        "403":
          description: Meta refused the action, for example error code `2494191` when Kapso may not take the conversation
          content:
            application/json:
              schema:
                type: object
              example:
                error:
                  code: 2494191
                  message: You are not permitted to take thread control for this phone number.
        "409":
          description: Another action for this conversation is still in progress
          content:
            application/json:
              schema:
                type: object
              example:
                error: thread_control_in_progress
                detail: Another control action for this conversation is still in progress.
        "502":
          description: Meta did not answer; the result is unknown. Do not retry automatically.
          content:
            application/json:
              schema:
                type: object
              example:
                error: Meta API request failed
                detail: The thread control result is unknown. Do not retry automatically.
