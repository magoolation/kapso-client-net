          description: Custom request headers
        buffer_enabled:
          type:
            - boolean
            - "null"
          description: Batch messages before delivery
        buffer_window_seconds:
          type:
            - integer
            - "null"
          description: Seconds to wait before sending batch
        max_buffer_size:
          type:
            - integer
            - "null"
          description: Max messages per batch
        buffer_events:
          type: array
          description: Events to buffer
          items:
            type: string
        inactivity_minutes:
          type:
            - integer
            - "null"
          description: Trigger inactivity event after N minutes
        payload_version:
          type:
            - string
            - "null"
          description: Webhook payload format version (defaults to 'v2')

    WhatsappWebhookRequest:
      type: object
      required:
        - whatsapp_webhook
      properties:
        whatsapp_webhook:
          type: object
          required:
            - url
            - secret_key
          oneOf:
            - title: Kapso webhook
              description: Event-based delivery in Kapso's payload format. This is the
                shape you get when `kind` is omitted, and it needs at least one event.
              required:
                - events
              properties:
                kind:
                  const: kapso
                events:
                  type: array
                  minItems: 1
            - title: Meta webhook
              description: Raw Meta forwarding. `kind` must be given explicitly, and
                any events you send are normalized to an empty list.
              required:
                - kind
              properties:
                kind:
                  const: meta
          properties:
            url:
              type: string
              format: uri
              description: Webhook delivery endpoint
            kind:
              type: string
              enum: [ kapso, meta ]
              default: kapso
              description: Webhook type - 'kapso' for event-based webhooks, 'meta' for raw
                Meta payload forwarding
            secret_key:
              type: string
              minLength: 1
              description: Secret for request verification. Required for every webhook,
                including 'meta' ones, and never generated for you
            active:
              type: boolean
              description: Enable deliveries
            buffer_enabled:
              type: boolean
              description: Batch messages before delivery (not supported for 'meta' webhooks)
            buffer_window_seconds:
              type:
                - integer
                - "null"
              description: Seconds to wait (1-60, default 5)
            max_buffer_size:
              type:
                - integer
                - "null"
              description: Max messages per batch (1-100)
            inactivity_minutes:
              type:
                - integer
                - "null"
              description: Minutes before inactivity event
            events:
              type: array
              description: Event subscriptions (e.g., whatsapp.message.received).
                Required and non-empty when kind is 'kapso' (the default).
                For 'meta' webhooks anything you send here is normalized to
                an empty list, since Meta decides what it sends
              items:
                type: string
            buffer_events:
              type: array
              description: Events to buffer (not supported for 'meta' webhooks)
              items:
                type: string
            headers:
              type:
                - object
                - "null"
              additionalProperties: true
              description: Custom request headers
            payload_version:
              type:
                - string
                - "null"
              description: Webhook payload format version (defaults to 'v2', not applicable
                for 'meta' webhooks)

    WhatsappWebhookUpdateRequest:
