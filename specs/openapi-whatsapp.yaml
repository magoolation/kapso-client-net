                    type: string
                  status:
                    type: string
                    enum:
                      - DRAFT
                      - PUBLISHED
                      - DEPRECATED
                      - BLOCKED
                      - THROTTLED
                  categories:
                    type: array
                    items:
                      type: string
                  validation_errors:
                    type: array
                    items:
                      type: object
                  json_version:
                    type: string
                  data_api_version:
                    type: string
                  endpoint_uri:
                    type: string
                    format: uri
                  preview:
                    type: object
                    properties:
                      preview_url:
                        type: string
                        format: uri
                      expires_at:
                        type: string
                        format: date-time
                  health_status:
                    type: object
                    description: Health status of flow and related entities
              example:
                id: flow-1
                name: appointment_booking
                status: DRAFT
                categories:
                  - APPOINTMENT_BOOKING
                validation_errors: []
                json_version: "3.0"
                data_api_version: "3.0"
                endpoint_uri: https://example.com
