  /customers/{customer_id}/setup_links:
    parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Setup Links
      summary: List setup links
      description: Get WhatsApp onboarding links for a customer, most recent first.
      operationId: listCustomerSetupLinks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - used
              - expired
              - revoked
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          schema:
            type: string
            format: date-time
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Success
          headers:
            X-Total:
              schema:
                type: integer
            X-Total-Pages:
              schema:
                type: integer
            X-Per-Page:
              schema:
                type: integer
            X-Page:
              schema:
                type: integer
            Link:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    post:
      tags:
        - Setup Links
      summary: Create setup link
      description: |
        Generate an onboarding setup for customers to connect their WhatsApp number.

        Open the returned URL as a Kapso-hosted page, or use the returned token with `@kapso/sdk` when your Tech Provider app belongs to an active Kapso Multi-partner Solution. The setup can optionally provision a new number.
      operationId: createCustomerSetupLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupLinkCreateRequest"
            examples:
              minimal:
                summary: Basic link
                value:
                  setup_link: {}
              with_redirects:
                summary: Custom success/failure URLs
                value:
                  setup_link:
                    success_redirect_url: https://yourapp.com/whatsapp/success
                    failure_redirect_url: https://yourapp.com/whatsapp/failed
              embedded_sdk:
                summary: Launch from a Tech Provider product with @kapso/sdk
                value:
                  setup_link:
                    allowed_origins:
                      - https://app.example.com
                    allowed_connection_types:
                      - dedicated
              coexistence_only:
                summary: Force coexistence mode
                value:
                  setup_link:
                    allowed_connection_types:
                      - coexistence
              with_kapso_billing:
                summary: Pay Meta fees with Kapso credits
                value:
                  setup_link:
                    meta_billing_mode: partner_managed
              with_phone:
                summary: Auto-provision number
                value:
                  setup_link:
                    provision_phone_number: true
                    phone_number_area_code: "415"
                    phone_number_country_isos:
                      - US
              branded:
                summary: Custom brand colors
                value:
                  setup_link:
                    theme_config:
                      primary_color: "#3b82f6"
                      primary_foreground_color: "#ffffff"
                      background_color: "#f9fafb"
                      text_color: "#111827"
                      border_color: "#d1d5db"
              reconnect:
                summary: Reconnect an existing customer number
                value:
                  setup_link:
                    reconnect_phone_number: "+14155551234"
      responses:
        "201":
          description: Setup link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkCreateResponse"
              examples:
                created:
                  value:
                    data:
                      id: 7f8a9b1c-2d3e-4f5a-6b7c-8d9e0f1a2b3c
                      status: active
                      created_at: "2025-01-15T10:00:00Z"
                      expires_at: "2025-02-14T10:00:00Z"
                      url: https://app.kapso.ai/whatsapp/setup/aBcD123xyz456def789
                      token: aBcD123xyz456def789
                      success_redirect_url: https://yourapp.com/whatsapp/success
                      failure_redirect_url: https://yourapp.com/whatsapp/failed
                      allowed_origins:
                        - https://app.example.com
                      allowed_connection_types:
                        - coexistence
                        - dedicated
                      meta_billing_mode: customer_managed
                      provision_phone_number: false
                      phone_number_area_code: null
                      phone_number_country_isos:
                        - US
                      reconnect_phone_number: null
                      theme_config:
                        primary_color: "#3b82f6"
                        primary_foreground_color: "#ffffff"
                        background_color: "#f9fafb"
                        text_color: "#111827"
                        border_color: "#d1d5db"
                      whatsapp_setup_status: pending
                      whatsapp_setup_error: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

