                muted_text_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                card_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                muted_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                border_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                secondary_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                secondary_foreground_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                destructive_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
                destructive_foreground_color:
                  type: string
                  pattern: ^#[0-9A-Fa-f]{6}$
            phone_number_country_isos:
